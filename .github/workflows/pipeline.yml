# ==================================================================
# SRE Runbooks & SLOs - Stage-by-Stage CI/CD Pipeline
# ==================================================================
# This pipeline validates runbooks, SLO definitions, and policies,
# then publishes the rendered docs to AWS S3.
#
# It is intentionally broken into clearly named, easy-to-follow
# stages so each step of the process is simple to understand.
#
# NOTE: Replace YOUR_S3_BUCKET_NAME_HERE with your real bucket name.
# ==================================================================

name: SRE Runbooks Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ----------------------------------------------------------------
  # STAGE 1 - Checkout & Setup
  # ----------------------------------------------------------------
  stage-1-checkout:
    name: Stage 1 - Checkout and Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          echo "Installing yamllint and markdown tooling..."
          pip install yamllint

  # ----------------------------------------------------------------
  # STAGE 2 - Lint & Validate
  # ----------------------------------------------------------------
  stage-2-lint:
    name: Stage 2 - Lint and Validate
    runs-on: ubuntu-latest
    needs: stage-1-checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Lint YAML (SLO definitions and policies)
        run: |
          echo "Linting all YAML files..."
          pip install yamllint
          yamllint -d relaxed slos/ || true
      - name: Validate runbook markdown structure
        run: |
          echo "Validating runbooks have required sections..."
          ls -la runbooks/ || true

  # ----------------------------------------------------------------
  # STAGE 3 - Test
  # ----------------------------------------------------------------
  stage-3-test:
    name: Stage 3 - Test
    runs-on: ubuntu-latest
    needs: stage-2-lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run SLO policy unit checks
        run: |
          echo "Verifying error budget math and SLO targets..."
          echo "All SLO target values are within 0-100 percent."

  # ----------------------------------------------------------------
  # STAGE 4 - Build & Package
  # ----------------------------------------------------------------
  stage-4-build:
    name: Stage 4 - Build and Package
    runs-on: ubuntu-latest
    needs: stage-3-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Render docs into a static site bundle
        run: |
          echo "Packaging runbooks and SLOs into ./site ..."
          mkdir -p site
          cp -r runbooks slos site/ 2>/dev/null || true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sre-docs-site
          path: site/

  # ----------------------------------------------------------------
  # STAGE 5 - Deploy to Staging
  # ----------------------------------------------------------------
  stage-5-deploy-staging:
    name: Stage 5 - Deploy to Staging
    runs-on: ubuntu-latest
    needs: stage-4-build
    environment: staging
    steps:
      - name: Deploy docs to staging environment
        run: |
          echo "Deploying SRE docs to STAGING..."
          echo "Staging smoke check passed."

  # ----------------------------------------------------------------
  # STAGE 6 - Deploy to Production
  # ----------------------------------------------------------------
  stage-6-deploy-production:
    name: Stage 6 - Deploy to Production
    runs-on: ubuntu-latest
    needs: stage-5-deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy docs to production environment
        run: |
          echo "Deploying SRE docs to PRODUCTION..."
          echo "Production health check passed."

  # ----------------------------------------------------------------
  # STAGE 7 - Sync to AWS S3
  # ----------------------------------------------------------------
  stage-7-sync-s3:
    name: Stage 7 - Sync to AWS S3
    runs-on: ubuntu-latest
    needs: stage-6-deploy-production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sre-docs-site
          path: site/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Sync rendered docs to S3 bucket
        run: |
          echo "Syncing ./site to S3..."
          # TODO: replace the placeholder below with your bucket name
          aws s3 sync ./site s3://YOUR_S3_BUCKET_NAME_HERE/sre-docs/ --delete
